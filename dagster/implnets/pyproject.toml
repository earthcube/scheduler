[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gleanerio-scheduler"
version = "0.0.67"
description = "Tools for harvesting and loading on a schedule from gleaner configurations"
readme = "README_DEV.md"
requires-python = ">=3.11"
dependencies = [
    "dagit>=1.7.10",
    "dagster-postgres>=0.23.10",
    "dagster>=1.7.10",
    "dagster-graphql>=1.7.10",
    "dagster-webserver>=1.7.10",
    "dagster-docker>=0.23.10",
    "dagster-aws>=0.23.10",
    "dagster-slack>=0.23.10",
    "ipython-genutils==0.2.0",
    "advertools==0.13.2",
    "minio==7.1.13",
    "docker>=6.1.0",
    "dagstermill>=0.23.10",
    "notebook",
    "pydash",
    "pyyaml",
    "orjson",
    "earthcube-utilities",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
    "pytest>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
earthcube-utilities = { git = "https://github.com/earthcube/earthcube_utilities", branch = "199_dev_fixgraphreports", subdirectory = "earthcube_utilities" }


[tool.black]
line-length = 99
target-version = ['py37']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.isort]
atomic = true
line_length = 99
indent = '    '
multi_line_output = 3
include_trailing_comma = true
known_third_party = [
  "dagster",
  "pytest",
]

[tool.pylint.message_control]
# wrong-import-order disabled due to conflict with isort v5
disable="""
    bad-continuation,
    duplicate-code,
    wrong-import-order
    """
[tool.hatch.build.targets.wheel]
packages = ["workflows"]

[tool.dagster]
module_name = "workflows.ingest.ingest"
