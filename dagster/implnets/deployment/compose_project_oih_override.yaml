version: "3.9"

# DO NOT START IN PYCHARM (unless you set the env variables in your runconfig
# USE:
# ./docker_eco_prod_start.h
services:

    dagster-daemon:

# portainer issue, merging commands may need to create a combined customised on
#        command:
#        - "dagster-daemon"
#        - "run"
#        - "-w"
#        - "workspace.yaml"
        # merging rules add this
        depends_on:
            -   dagster-code-oih-ingest
            - dagster-code-oih-tasks
        networks:
            - traefik_proxy
## GRPC servers are not just serving the code
# they need to compile it, so same image for all dagster-*
    dagster-code-oih-ingest:
        image: docker.io/nsfearthcube/dagster-gleanerio-workflows:${CONTAINER_CODE_TAG:-latest}

        environment: &env
            - DEBUG_CONTAINER=${DEBUG_CONTAINER:-false}
            - GLEANERIO_CONFIG_PATH=${GLEANERIO_CONFIG_PATH:-scheduler/configs/test/}
            - GLEANERIO_DAGSTER_CONFIG_PATH=${GLEANERIO_DAGSTER_CONFIG_PATH:-scheduler/logs/}
            - GLEANERIO_DOCKER_CONTAINER_WAIT_TIMEOUT=${OIH_DOCKER_CONTAINER_WAIT_TIMEOUT:-300}
            - GLEANERIO_DOCKER_GLEANER_CONFIG=${OIH_DOCKER_GLEANER_CONFIG:-gleaner}
            - GLEANERIO_DOCKER_HEADLESS_NETWORK=${GLEANERIO_DOCKER_HEADLESS_NETWORK}
            - GLEANERIO_DOCKER_NABU_CONFIG=${OIH_DOCKER_NABU_CONFIG:-nabu}
            - GLEANERIO_DOCKER_URL=${OIH_DOCKER_URL}
            - GLEANERIO_DOCKER_WORKSPACE_CONFIG=${OIH_DOCKER_WORKSPACE_CONFIG}
            - GLEANERIO_GLEANER_CONFIG_PATH=${GLEANERIO_GLEANER_CONFIG_PATH:-/configs/gleaner/gleanerconfig.yaml}
            - GLEANERIO_GLEANER_IMAGE=${OIH_GLEANER_IMAGE}
            - GLEANERIO_GRAPH_SUMMARIZE=${OIH_GRAPH_SUMMARIZE:-false}
            - GLEANERIO_GRAPH_SUMMARY_ENDPOINT=${OIH_GRAPH_SUMMARY_ENDPOINT:-${OIH_GRAPH_URL}}
            - GLEANERIO_GRAPH_SUMMARY_NAMESPACE=${OIH_GRAPH_SUMMARY_NAMESPACE}
            - GLEANERIO_GRAPH_URL=${OIH_GRAPH_URL}
            - GLEANERIO_HEADLESS_ENDPOINT=${GLEANERIO_HEADLESS_ENDPOINT}
            - GLEANERIO_LOG_PREFIX=${GLEANERIO_LOG_PREFIX:-scheduler/logs/}
            - GLEANERIO_MINIO_ACCESS_KEY=${OIH_MINIO_ACCESS_KEY}
            - GLEANERIO_MINIO_ADDRESS=${OIH_MINIO_ADDRESS}
            - GLEANERIO_MINIO_BUCKET=${OIH_MINIO_BUCKET}
            - GLEANERIO_MINIO_PORT=${OIH_MINIO_PORT}
            - GLEANERIO_MINIO_SECRET_KEY=${OIH_MINIO_SECRET_KEY}
            - GLEANERIO_MINIO_USE_SSL=${OIH_MINIO_USE_SSL}
            - GLEANERIO_NABU_CONFIG_PATH=${GLEANERIO_NABU_CONFIG_PATH:-/configs/gleaner/nabuconfig.yaml}
            - GLEANERIO_NABU_IMAGE=${OIH_NABU_IMAGE}
            - GLEANERIO_PORTAINER_APIKEY=${OIH_PORTAINER_APIKEY}
            - GLEANERIO_DEFAULT_SCHEDULE=${OIH_DEFAULT_SCHEDULE:-@weekly}
            - GLEANERIO_DEFAULT_SCHEDULE_TIMEZONE=${OIH_DEFAULT_SCHEDULE_TIMEZONE:-America/Los_Angeles}
            - GLEANERIO_SOURCES_FILENAME=${OIH_SOURCES_FILENAME:-gleanerconfig.yaml}
            - GLEANERIO_TENANT_FILENAME=${OIH_TENANT_FILENAME:-tenant.yaml}
            - GLEANERIO_WORKSPACE_CONFIG_PATH=${GLEANERIO_WORKSPACE_CONFIG_PATH}
            - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
            - SLACK_CHANNEL=${OIH_SLACK_CHANNEL:-"#twitterfeed"}
            - SLACK_TOKEN=${OIH_SLACK_TOKEN}
        command:
            - "dagster"
            - "api"
            - "grpc"
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "4000"
            - "-m"
            - "workflows.ingest.ingest"
            - "-d"
            - "/usr/src/app/"

        volumes: &codevol
            - dagster-storage:/usr/src/app/storage
        depends_on:
            - dagster-postgres
        networks:
            - dagster_host

    dagster-code-oih-tasks:
        image: docker.io/nsfearthcube/dagster-gleanerio-workflows:${CONTAINER_CODE_TAG:-latest}
        environment: *env
        command:
        - "dagster"
        - "api"
        - "grpc"
        - "-h"
        - "0.0.0.0"
        - "-p"
        - "4000"
        - "-m"
        - "workflows.tasks.tasks"
        - "-d"
        - "/usr/src/app/"

        volumes: *codevol
        depends_on:
            - dagster-postgres
        networks:
            - dagster_host

