retention:
  schedule:
    purge_after_days: 7 # sets retention policy for schedule ticks of all types
  sensor:
    purge_after_days:
      skipped: 3
      failure: 3
      success: 7 # -1 is keep success ticks indefinitely
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir:
      env: DAGSTER_LOCAL_ARTIFACT_STORAGE_DIR
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 6
    # getting tags by copying from UI
    tag_concurrency_limits:
      - key: "ingest"
        value: "docker"
        limit: 3
      - key: "ingest"
        value: "report"
        limit: 2
      - key: "tenant_load"
        value: "graph"
        limit: 1
telemetry:
  enabled: false
